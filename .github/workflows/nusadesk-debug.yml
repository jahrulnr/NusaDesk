name: NusaDesk debug APK

on:
  push:
    # Validate every direct push and merge commit landing on master. Feature
    # branches are covered by pull_request runs, saving free-tier minutes.
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nusadesk-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Test, lint, and build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3/v4 default to installing the removed `tools` package. The
          # project installs only the pinned SDK components below.
          packages: ''

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Run tests, lint, and assemble debug
        run: make check

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nusadesk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
