name: NusaDesk debug release

on:
  push:
    branches: ["master"]
    # A release is created only when the release version changes. Changelog-only
    # and documentation commits must not retry an existing version tag.
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nusadesk-release
  cancel-in-progress: false

jobs:
  release-debug:
    name: Tag VERSION and publish debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate VERSION
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a valid semantic version: $version" >&2
            exit 1
          fi

          tag="v$version"
          # The published asset carries no build-type suffix: it is the
          # user-facing sideload download, built from the debug APK that
          # `make check` assembles.
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_asset=NusaDesk-$tag.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: release_gate
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; skipping this release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changelog and extract release notes
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -qE "^## \[$VERSION\]( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for VERSION=$VERSION" >&2
            exit 1
          fi

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]( |$)" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "The changelog section for $VERSION is empty" >&2
            exit 1
          fi

      - name: Set up Java 17
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Android SDK
        if: steps.release_gate.outputs.should_release == 'true'
        uses: android-actions/setup-android@v4
        with:
          # v3/v4 default to installing the removed `tools` package. The
          # project installs only the pinned SDK components below.
          packages: ''

      - name: Install Android build dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Cache Robolectric Android runtimes
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/cache@v6
        with:
          # Robolectric fetches one android-all jar (~110-160 MB) per API level
          # the launch test covers, into the local Maven repository rather than
          # the Gradle cache. Keyed on the test file so a change to the covered
          # SDK set re-seeds the entry instead of silently missing it.
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('app/src/test/java/gh/nusashell/nusadesk/presentation/MainActivityApiLevelLaunchTest.java') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run tests, lint, and assemble debug APK
        if: steps.release_gate.outputs.should_release == 'true'
        run: make check

      - name: Rename debug APK for the release asset
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        env:
          ASSET: ${{ steps.metadata.outputs.release_asset }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"

      - name: Create annotated tag
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "NusaDesk $VERSION"
          git push origin "$TAG"

      - name: Publish GitHub release with debug APK
        if: steps.release_gate.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.release_asset }}
        run: |
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NusaDesk $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
