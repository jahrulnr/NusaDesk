name: NusaDesk debug release

on:
  push:
    branches: ["master"]
    paths:
      - VERSION
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nusadesk-release
  cancel-in-progress: false

jobs:
  release-debug:
    name: Tag VERSION and publish debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # v3/v4 default to installing the removed `tools` package. The
          # project installs only the pinned SDK components below.
          packages: ''

      - name: Install Android build dependencies
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Validate VERSION and extract changelog notes
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION is not a valid semantic version: $version" >&2
            exit 1
          fi

          if ! grep -qE "^## \[$version\]( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for VERSION=$version" >&2
            exit 1
          fi

          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]( |$)" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "The changelog section for $version is empty" >&2
            exit 1
          fi

          tag="v$version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_asset=NusaDesk-$tag-debug.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

      - name: Run tests, lint, and assemble debug APK
        run: make check

      - name: Rename debug APK for the release asset
        shell: bash
        env:
          ASSET: ${{ steps.metadata.outputs.release_asset }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"

      - name: Create annotated tag
        shell: bash
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "NusaDesk $VERSION"
          git push origin "$TAG"

      - name: Publish GitHub release with debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ASSET: ${{ steps.metadata.outputs.release_asset }}
        run: |
          gh release create "$TAG" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NusaDesk $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
