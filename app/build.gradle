plugins {
    id 'com.android.application'
}

// Regular builds retain the native desktop across updates (ADR-0080).
// Developers may explicitly omit the GPL-linked display with -PnativeDesktop=false.
def nativeDesktopEnabled = providers.gradleProperty('nativeDesktop').orElse('true').get().toBoolean()

// The VERSION marker is the single source of truth for the app version
// (ADR-0067): versionName and versionCode are both derived here, so a release
// bump never hand-edits this file. The code mapping reserves three digits per
// field (major*1_000_000 + minor*1_000 + patch); the release flow keeps the
// marker a strict M.m.p, and anything else fails the build rather than
// producing a colliding or non-monotonic versionCode.
def releaseVersion = rootProject.file('VERSION').text.trim()
// Strict semver: numeric fields without leading zeros, each bounded to the
// three digits the versionCode mapping reserves.
def versionMatcher = (releaseVersion =~ /^(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})\.(0|[1-9]\d{0,2})$/)
if (!versionMatcher.matches()) {
    throw new GradleException(
            "VERSION must be a plain major.minor.patch release, not: " + releaseVersion)
}
def vMajor = versionMatcher.group(1).toInteger()
def vMinor = versionMatcher.group(2).toInteger()
def vPatch = versionMatcher.group(3).toInteger()
if (vMajor >= 1000 || vMinor >= 1000 || vPatch >= 1000) {
    throw new GradleException(
            "VERSION fields must stay under 1000 for the versionCode mapping: " + releaseVersion)
}
def derivedVersionCode = vMajor * 1000000 + vMinor * 1000 + vPatch

// The About page reads the bundled changelog (ADR-0066). The asset is the
// repository CHANGELOG.md staged into a generated directory at build time —
// the file itself is never copied into src/ or committed twice. The task
// name deliberately does not end with 'Assets' so the consumer fan-out below
// cannot self-depend; AGP 9's strict input validation requires every
// consumer of the generated directory (asset merges, lint) to declare the
// producer.
def changelogAssetsDir = new File(layout.buildDirectory.get().asFile, 'generated/changelog-assets')

tasks.register('generateChangelogAsset', Copy) {
    from rootProject.file('CHANGELOG.md')
    into changelogAssetsDir
}

android {
    namespace 'gh.nusashell.nusadesk'
    compileSdk 37

    sourceSets {
        main.assets.srcDir changelogAssetsDir
        if (nativeDesktopEnabled) {
            main.jniLibs.srcDir layout.buildDirectory.dir('generated/native-display').get().asFile
            main.assets.srcDir layout.buildDirectory.dir('generated/native-display-assets').get().asFile
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        applicationId 'gh.nusashell.nusadesk'
        minSdk 29
        targetSdk 37
        versionCode derivedVersionCode
        versionName releaseVersion
        buildConfigField 'boolean', 'NATIVE_DESKTOP_ENABLED', nativeDesktopEnabled.toString()
    }

    // Release signing (ADR-0040). The published GitHub/F-Droid APK must be
    // signed with a stable, dedicated key: the platform refuses to update an
    // installed app whose signer changed, so an ephemeral CI debug keystore
    // (the previous behavior) could never update a previously published
    // release, and the in-app update flow (ADR-0039) depends on it. CI
    // decodes the keystore from repository secrets and points
    // ANDROID_KEYSTORE_PATH at it. Without those variables a local release
    // build stays unsigned and debug builds keep the default debug signing —
    // both deliberate: only CI publishes artifacts, and it fails closed when
    // the pinned key is missing.
    def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // QA builds (-PqaDebuggable=true) keep the release signing config
            // but make the APK debuggable, so a device probe can reach the
            // app's own data directory through run-as while the installed
            // release keeps its signature and guest data. Never published.
            if (project.hasProperty('qaDebuggable')) {
                debuggable true
            }
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        abortOnError true
        warningsAsErrors true
        // The wrapper version is intentionally pinned by the foundation build contract.
        disable 'AndroidGradlePluginVersion'
        // Pinned dependency versions are deliberate, not stale: Bouncy Castle
        // bcprov 1.84 is the version Apache MINA SSHD 2.19.0 targets, and 1.86
        // was published only ~2 days before this change (violating the >=7-day
        // vetting rule). slf4j 1.7.36 is MINA's target line. Suppress the
        // freshness nudge so the supply-chain vetting rule wins over "newer
        // is available". (bcpkix was removed: see dependencies comment.)
        disable 'NewerVersionAvailable'
        // ScopedStorage flags MANAGE_EXTERNAL_STORAGE as a Google Play policy
        // risk. The permission is deliberate here (ADR-0023): the guest binds a
        // user-chosen folder, PRoot needs a real host path, and on Android 11+
        // only all-files access allows one. It is never assumed — the product
        // asks for the grant from a visible explanation, and binds nothing
        // without it. Disabling the check is the honest record of that decision;
        // WorkspaceStorageManifestTest keeps the manifest contract pinned. A
        // Google Play release would need the All files access declaration form
        // and an approved use case; today the project ships only the signed
        // GitHub release APK.
        disable 'ScopedStorage'
        // BatteryLife flags the REQUEST_IGNORE_BATTERY_OPTIMIZATIONS dialog
        // intent as a Play policy risk, exactly like ScopedStorage above. The
        // permission is already declared and pinned (BridgePermissionsManifest
        // Test), and the intent fires only from the battery card's explicit tap
        // on the Linux system screen — never at launch, never in the
        // background. The recommended exemption is itself one of Android's
        // documented background-start exemptions, which is why the card exists;
        // it mitigates OEM throttling of the runtime host service (ADR-0037).
        // The distribution channel is the signed GitHub release APK / F-Droid,
        // so the Play policy rule does not bind this project today.
        disable 'BatteryLife'
    }

    testOptions {
        unitTests {
            returnDefaultValues true
            includeAndroidResources true
        }
    }

    // The packaged PRoot execution bridge (ADR-004) is an executable PIE renamed
    // libproot.so. The Android host must execve() it from a read-only executable
    // path (ApplicationInfo.nativeLibraryDir); it is NOT a JNI library and is
    // never dlopen'd. AGP's default for minSdk 29 is extractNativeLibs=false,
    // which keeps the .so inside the APK and loads it via dlopen — that leaves
    // nativeLibraryDir empty and breaks the ADR-004 execve contract (ADR-0008
    // blocker 1). useLegacyPackaging=true makes the package installer extract
    // native libs from the APK into nativeLibraryDir at install time and chmod
    // them executable, which is exactly the contract the bridge needs. This is a
    // packaging/extraction option, not a security control: the libs still come
    // from the signed APK and land in the app-private read-only lib dir. It does
    // not alter networkSecurityConfig, cleartext, backup, or any permission.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        // Never add a .gz-suffixed file under assets/: AGP's asset merge
        // (MergedAssetWriter) gunzips it and strips the suffix before the APK
        // is written — androidResources noCompress cannot prevent it on
        // AGP 9.4 (verified: mergeDebugAssets emits udocker-1.3.17.tar from
        // udocker-1.3.17.tar.gz). Gzipped payloads ship under .tgz instead;
        // see assets/compose/THIRD_PARTY_NOTICES.md.
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.DSA',
                'META-INF/*.SF',
                'META-INF/*.RSA',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }
}

if (nativeDesktopEnabled) {
    tasks.register('buildNativeDesktop', Exec) {
        workingDir rootProject.projectDir
        commandLine 'bash', rootProject.file('scripts/build-x11-arm64.sh').absolutePath
        inputs.file rootProject.file('scripts/build-x11-arm64.sh')
        inputs.file rootProject.file('third_party/termux-x11/nusadesk.patch')
        inputs.file rootProject.file('scripts/verify-x11-submodules.sh')
        inputs.file rootProject.file('third_party/termux-x11/README.md')
        inputs.file rootProject.file('third_party/termux-x11/submodules.lock')
        inputs.file rootProject.file('scripts/build-virgl-arm64.sh')
        inputs.file rootProject.file('third_party/virglrenderer/android.patch')
        inputs.file rootProject.file('third_party/virglrenderer/README.md')
        outputs.file layout.buildDirectory.file('generated/native-display/arm64-v8a/libXlorie.so')
        outputs.file layout.buildDirectory.file('generated/native-display/arm64-v8a/libvirglserver.so')
        outputs.dir layout.buildDirectory.dir('generated/native-display-assets')
    }
    tasks.named('preBuild').configure { dependsOn 'buildNativeDesktop' }
}

dependencies {
    // AndroidX WebKit 1.15.0, Apache-2.0; stable since 2025-12-17.
    // Official origin-scoped messaging and document-start injection catch browser
    // exports before URL.revokeObjectURL, without a broad JavaScript interface.
    // Feature availability is checked against the installed WebView (ADR-0084).
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    // Static SVG favicon rasterization. AndroidSVG 1.4 (Apache-2.0), pinned to
    // the upstream stable Maven Central release. Mature Android Canvas renderer;
    // avoids a handwritten SVG parser and a WebView for launcher icons. No
    // external resource resolver is registered. See ADR-0071 and bundled notice.
    implementation 'com.caverock:androidsvg-aar:1.4'

    // SSH client bridge core. Apache MINA SSHD is a real Java SSH client/server
    // library (Apache License 2.0). Only the client side is used at runtime; the
    // server side is pulled in transitively by sshd-core and reused as an
    // in-process test fixture, never shipped as a guest SSH server (Ubuntu Base
    // does not provide one — see SshClientBridge JavaDoc). Versions are pinned
    // exactly; Bouncy Castle bcprov 1.84 is the version MINA SSHD 2.19.0 targets
    // and is deliberately older than the very latest release to stay vetted.
    //
    // Only bcprov is needed: MINA registers BouncyCastleProvider (bcprov) for
    // JCA and uses its own built-in key-pair parsers
    // (PEMResourceParserUtils.PROXY + OpenSSHKeyPairResourceParser) for key
    // loading — none of which require bcpkix. The bcpkix-dependent classes
    // (BouncyCastleKeyPairResourceParser, BouncyCastleEncryptedPrivateKeyInfo
    // Decryptor, BouncyCastleGeneratorHostKeyProvider) are only invoked for
    // encrypted PKCS8 keys, PEM host-key writing, or explicit BC parser
    // registration, none of which this app does (SshClientBridge.loadKeyPair
    // passes a null FilePasswordProvider and never calls setKeyPairResource
    // Parser). bcpkix also shipped org.bouncycastle.est.jcajce helpers that
    // tripped the TrustAllX509TrustManager lint check; removing bcpkix fixes
    // that at the source instead of suppressing the security check globally.
    implementation 'org.apache.sshd:sshd-core:2.19.0'
    implementation 'org.apache.sshd:sshd-common:2.19.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'net.i2p.crypto:eddsa:0.3.0'
    implementation 'org.slf4j:slf4j-api:1.7.36'

    // The required Compose YAML boundary (Phase 2A): SnakeYAML Engine is the
    // vetted YAML 1.2 parser for compose files — the only permitted entry
    // point, no hand-rolled parsing. Version pinned exactly; no ranges.
    implementation 'org.snakeyaml:snakeyaml-engine:3.1.1'

    // A built-in folder picker for the workspace is written in this repository
    // (WorkspaceFolderBrowserDialog + WorkspaceFolderListing) instead of coming
    // from a library. Evaluated 2026-09-20 and rejected: the maintained
    // path-based candidate (io.github.tutorialsandroid:filepicker:10.1.3,
    // Apache-2.0, pure Java, empty manifest, Maven Central) gates its own
    // show() on storage access and below API 30 accepts only
    // READ_EXTERNAL_STORAGE — a broader grant than this feature needs, which
    // WorkspaceStorageManifestTest forbids; on Android 11+ it works but selects
    // a *marked* folder rather than the folder in view, which is not the
    // "use this folder" semantics this product wants. hedzr/android-file-chooser
    // (archived 2022, stopped for Android 10+) and spacecowboy/NoNonsense-
    // FilePicker (archived 2022) were rejected as unmaintained. The in-repo
    // browser keeps one implementation for every API level, adds no dependency,
    // and needs no permission beyond the all-files grant this app already holds.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.slf4j:slf4j-simple:1.7.36'
    // Robolectric runs the real framework classes of a chosen API level on the
    // JVM, so one test can guard several Android releases at once.
    testImplementation 'org.robolectric:robolectric:4.15.1'
}

// Every consumer of the generated changelog assets directory must declare its
// producer under AGP 9's strict input validation: the *Assets merges, the
// lint-model generation tasks, and lint tasks themselves (lowercase
// 'lint*' names). 'preBuild' backstops anything resolved only by name.
tasks.matching {
    it.name == 'preBuild' || it.name.endsWith('Assets')
            || it.name.contains('Lint') || it.name.startsWith('lint')
}.configureEach {
    dependsOn 'generateChangelogAsset'
}
