<!doctype html>
<!--
  Terminal host page for the LinuxWrapper SSH bridge.

  This page is a THIN loader: it loads the pinned, local xterm.js bundle
  (xterm.js, xterm.css, addon-fit.js) from the same assets directory and
  exposes a minimal, focused JS-side contract (window.LinuxWrapperTerminal)
  for the Android presentation layer to proxy to SshClientBridge. It contains
  NO homemade terminal emulation — all rendering is done by upstream xterm.js.

  Security: load this only from an owned origin. The Android side must expose
  only a minimal, origin-checked JavascriptInterface that proxies the few
  methods below (write/resize/notifyOutputSinkReady), NOT a broad bridge.
  External links are not handled here; they are the WebView host's job.

  Contract (window.LinuxWrapperTerminal):
    write(textOrBytes)        host -> terminal: write SSH stdout to the screen.
    writeStderr(textOrBytes)  host -> terminal: write SSH stderr to the screen.
    resize(cols, rows)        host -> terminal: set the PTY size and refit.
    fit()                     fit the terminal to its container.
    focus()                   focus the terminal for input.
    reset()                   clear the screen and scrollback (new log/source).
    fontSize(px)              host -> terminal: set cell font size, then refit.
    size()                    terminal -> host: {cols, rows} actually rendered.
    onInput(callback)         terminal -> host: callback(data:string) for stdin.
    onResize(callback)        terminal -> host: callback(cols, rows) on resize.
    onScrollState(callback)   terminal -> host: callback(1|0) when the viewport
                              leaves / returns to the live bottom.
    dispose()                 tear down the terminal.
    ready()                   returns true once the terminal is initialised.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Terminal</title>
  <link rel="stylesheet" href="xterm.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #terminal {
      width: 100vw;
      height: 100vh;
      /* The gesture adapter handles the vertical drag at the page boundary and
         preventDefaults touchmove while scrolling; the page is exactly
         viewport-sized so there is nothing for the compositor to pan.
         touch-action must NOT be none here: inside a touch-action:none
         region Android WebView never runs its long-press word selection. */
      overscroll-behavior: none;
    }
    /* xterm 6 renders each row as real DOM text (the DomRenderer is the only
       bundled renderer). Upstream disables text selection on .xterm and makes
       the row layer pointer-events:none because desktop xterm owns selection
       itself; here the platform's own long-press selection action mode is the
       only copy path, so the rendered text layers stay hit-testable and
       selectable. Nothing else in this page or the host touches the
       clipboard. */
    .xterm {
      -webkit-user-select: text;
      user-select: text;
    }
    .xterm .xterm-screen .xterm-rows,
    .xterm .xterm-screen .xterm-rows * {
      pointer-events: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    /* The hidden helper textarea is repositioned onto the cursor cell for IME
       placement; if it stays hit-testable it wins the hit under a finger and
       Android shows the editable-context paste menu instead of text
       selection. It is focused programmatically, never by touch. */
    .xterm .xterm-helper-textarea {
      pointer-events: none;
    }
    /* Read-only log viewers must keep the gesture for scrollback. The
       interactive shell leaves this class absent so Android still owns its
       long-press text selection and Copy action mode. */
    #terminal.native-selection-disabled {
      /* Read-only logs do not need browser selection or page panning. Keep
         every touchmove in the adapter so a held drag remains realtime. */
      touch-action: none;
    }
    #terminal.native-selection-disabled .xterm,
    #terminal.native-selection-disabled .xterm .xterm-screen .xterm-rows,
    #terminal.native-selection-disabled .xterm .xterm-screen .xterm-rows * {
      -webkit-user-select: none !important;
      user-select: none !important;
    }
  </style>
</head>
<body>
  <div id="terminal" aria-label="Terminal"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="touch-scroll.js"></script>
  <script src="dom-selection.js"></script>
  <script>
    (function () {
      "use strict";

      var Terminal = window.Terminal;
      var FitAddon = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);

      var term = new Terminal({
        cols: 80,
        rows: 24,
        cursorBlink: true,
        scrollback: 1000,
        // Touch scrolling bypasses this wheel-step animation and writes the
        // xterm pixel position directly, while mouse-wheel scrolling keeps its
        // short native-like interpolation.
        smoothScrollDuration: 80,
        // Compact monospace stack: the bundled WebView ships a default
        // monospace; the named faces are tried first where present and fall back
        // to the platform default. A smaller cell than the upstream default
        // (15px) keeps phone columns from wrapping mid-command while staying
        // readable on high-DPI screens. lineHeight stays at 1.0 so rows stay
        // tight without clipping descenders.
        fontFamily: "'DejaVu Sans Mono','Liberation Mono','Menlo','Consolas',monospace",
        fontSize: 13,
        lineHeight: 1.0,
        allowProposedApi: true
      });
      var container = document.getElementById("terminal");
      term.open(container);

      var fitAddon = null;
      if (FitAddon) {
        fitAddon = new FitAddon();
        term.loadAddon(fitAddon);
        try { fitAddon.fit(); } catch (e) { /* container may not be sized yet */ }
      }

      var domSelection = window.LinuxWrapperDomSelection
          ? window.LinuxWrapperDomSelection.install(container)
          : null;
      function fitWithoutBreakingSelection() {
        if (!fitAddon) { return; }
        var run = function () {
          try { fitAddon.fit(); } catch (e) { /* container may not be sized yet */ }
        };
        if (domSelection) {
          domSelection.requestFit(run);
        } else {
          run();
        }
      }

      function setNativeTextSelectionEnabled(enabled) {
        var shouldEnable = enabled !== false;
        container.classList.toggle("native-selection-disabled", !shouldEnable);
        if (!shouldEnable) {
          var selection = document.getSelection ? document.getSelection() : null;
          if (selection) { selection.removeAllRanges(); }
        }
      }

      // Decode bytes (ArrayBuffer/Uint8Array) or pass strings straight through.
      function decode(data) {
        if (data == null) return "";
        if (typeof data === "string") return data;
        var bytes = (data instanceof ArrayBuffer) ? new Uint8Array(data) : data;
        return new TextDecoder("utf-8").decode(bytes);
      }

      var inputCb = null;
      var resizeCb = null;

      term.onData(function (data) {
        if (typeof inputCb === "function") inputCb(data);
      });
      term.onResize(function (size) {
        emitScrollState();
        if (typeof resizeCb === "function") resizeCb(size.cols, size.rows);
      });

      window.addEventListener("resize", fitWithoutBreakingSelection);

      // Mobile touch-to-scrollback adapter (see touch-scroll.js). xterm.js 6.0.0
      // does not scroll the viewport on a one-finger drag on Android WebView;
      // this follows the finger through xterm's fractional pixel controller
      // and adds bounded release momentum without stealing taps, keyboard
      // input, native long-press selection, or xterm mouse-tracking gestures.
      var touchScroll = null;
      if (window.LinuxWrapperTouchScroll) {
        touchScroll = window.LinuxWrapperTouchScroll.install(container, term);
      }

      // Tell the host whether the viewport is scrolled away from the live
      // bottom so it can show or hide its "scroll to live output" button.
      // Emitted only on transitions, and only for real viewport movement.
      var scrollStateCb = null;
      var lastScrolledBack = null;
      function emitScrollState() {
        var buf = term.buffer.active;
        var away = buf.viewportY < buf.baseY;
        if (lastScrolledBack !== away) {
          lastScrolledBack = away;
          if (typeof scrollStateCb === "function") { scrollStateCb(away ? 1 : 0); }
        }
      }
      term.onScroll(emitScrollState);
      emitScrollState();

      /* xterm registers a desktop-oriented contextmenu listener on .xterm that
         moves its hidden helper textarea under the pointer and selects it. On
         Android WebView that collapses the platform selection that the
         long-press just created and surfaces the editable paste menu instead
         of the stock selection action mode. Stopping propagation in the
         capture phase keeps that handler from running; the event is NOT
         cancelled, so the platform's default selection behavior proceeds. */
      document.addEventListener("contextmenu", function (e) {
        if (e.target && e.target.closest && e.target.closest(".xterm")) {
          e.stopPropagation();
        }
      }, true);

      window.LinuxWrapperTerminal = {
        ready: function () { return true; },
        write: function (data) { term.write(decode(data)); },
        writeStderr: function (data) { term.write(decode(data)); },
        resize: function (cols, rows) {
          try { term.resize(cols, rows); } catch (e) { /* ignore */ }
        },
        fit: fitWithoutBreakingSelection,
        focus: function () { term.focus(); },
        setNativeTextSelectionEnabled: setNativeTextSelectionEnabled,
        reset: function () {
          /* xterm's own reset: clears the screen, the scrollback, and parser
             state, so a switched log source never inherits stale output. */
          try { term.reset(); } catch (e) { /* ignore */ }
        },
        fontSize: function (px) {
          /* The log viewer asks for a denser surface than the shell. Clamped
             defensively even though the host already clamps, then refit so the
             column count follows the new cell size. */
          var n = Math.round(Number(px));
          if (!isFinite(n)) { return; }
          term.options.fontSize = Math.min(Math.max(n, 8), 24);
          fitWithoutBreakingSelection();
        },
        size: function () { return { cols: term.cols, rows: term.rows }; },
        onInput: function (cb) { inputCb = cb; },
        onResize: function (cb) { resizeCb = cb; },
        onScrollState: function (cb) { scrollStateCb = cb; },
        dispose: function () {
          if (touchScroll) {
            touchScroll();
            touchScroll = null;
          }
          if (domSelection) { domSelection.dispose(); }
          term.dispose();
        }
      };
    })();
  </script>
</body>
</html>
